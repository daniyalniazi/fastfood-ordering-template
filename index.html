<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizza Store</title>
<meta name="description" content="Online ordering website and admin panel template for pizza shops and small restaurants.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8D%95%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
/* ============================================================
   THEME TOKENS
   You normally don't edit these. Brand color and fonts are set in
   config.js (theme section). The value after each comma below is
   only a fallback used if config.js is missing.
   ============================================================ */
:root{
  color-scheme:light;
  --brand:var(--b-brand,#2F5BD3);--brand-press:var(--b-press,#274CB1);--brand-tint:var(--b-tint,#ECF0FB);--brand-line:var(--b-line,#C5D1F3);--on-brand:var(--b-on,#FFFFFF);
  --danger:#C42B2B;--danger-tint:#FCEDED;--danger-line:#F2C7C8;
  --ink:#363435;--ink-2:#5F5B5C;--ink-3:#8A8586;
  --paper:#F7F7F7;--card:#FFFFFF;--tile:#F2EFEE;--line:#E7E3E3;--line-2:#D6D1D1;
  --green:#1B7A45;--green-tint:#E5F3EA;--amber:#8C5900;--amber-tint:#FFF2D9;
  --side:#2E2C2D;--side-ink:#F3F1F1;--side-mute:#ABA5A6;--side-hover:#3B3839;--side-active:#474344;
  --shadow-1:0 1px 2px rgba(54,52,53,.06),0 4px 14px rgba(54,52,53,.06);
  --shadow-pop:0 24px 60px rgba(20,18,19,.24);
  --f-display:var(--font-display,"Lilita One"),"Arial Rounded MT Bold","Arial Black",system-ui,sans-serif;
  --f-body:var(--font-body,"Figtree"),system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r-sm:8px;--r-md:14px;--r-lg:22px;
  --hdr-h:68px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --brand:var(--d-brand,#7E99E4);--brand-press:var(--d-press,#95ABE9);--brand-tint:var(--d-tint,#2A2D39);--brand-line:var(--d-line,#3D4560);--on-brand:var(--d-on,#1A1819);
    --danger:#F06A6A;--danger-tint:#3A2223;--danger-line:#5E2D2F;
    --ink:#F2EFEF;--ink-2:#C3BCBD;--ink-3:#938C8D;
    --paper:#1A1819;--card:#242122;--tile:#2E2A2B;--line:#373233;--line-2:#4A4344;
    --green:#52C58D;--green-tint:#15301F;--amber:#F0B550;--amber-tint:#33270E;
    --side:#141213;--side-hover:#242122;--side-active:#333031;
    --shadow-1:0 1px 2px rgba(0,0,0,.35);--shadow-pop:0 24px 60px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --brand:var(--d-brand,#7E99E4);--brand-press:var(--d-press,#95ABE9);--brand-tint:var(--d-tint,#2A2D39);--brand-line:var(--d-line,#3D4560);--on-brand:var(--d-on,#1A1819);
  --danger:#F06A6A;--danger-tint:#3A2223;--danger-line:#5E2D2F;
  --ink:#F2EFEF;--ink-2:#C3BCBD;--ink-3:#938C8D;
  --paper:#1A1819;--card:#242122;--tile:#2E2A2B;--line:#373233;--line-2:#4A4344;
  --green:#52C58D;--green-tint:#15301F;--amber:#F0B550;--amber-tint:#33270E;
  --side:#141213;--side-hover:#242122;--side-active:#333031;
  --shadow-1:0 1px 2px rgba(0,0,0,.35);--shadow-pop:0 24px 60px rgba(0,0,0,.6);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hdr-h) + 64px);height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico--sm{width:16px;height:16px}
.ico--lg{width:24px;height:24px}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 20px}
h1,h2,h3,h4{margin:0;line-height:1.15}
.display{font-family:var(--f-display);font-weight:400;letter-spacing:.005em}
p{margin:0}

/* ---------- demo bar (turn off with demoBar: false in config.js) ---------- */
.proto{background:#2A2829;color:#F7F7F7;font-size:13px}
:root[data-theme="dark"] .proto{background:#000}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .proto{background:#000}}
.proto__in{display:flex;align-items:center;gap:12px;height:38px;max-width:1440px;margin:0 auto;padding:4px 16px}
.proto__tag{opacity:.75;white-space:nowrap}
.proto__seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.proto__seg a{padding:4px 12px;border-radius:999px;text-decoration:none;color:inherit;font-weight:600;white-space:nowrap}
.proto__seg a.is-on{background:#F7F7F7;color:#363435}

.proto__reset{margin-left:auto;background:none;border:0;color:inherit;opacity:.75;font-size:13px;display:inline-flex;gap:6px;align-items:center;padding:4px 6px}
.proto__reset:hover{opacity:1}

/* ---------- buttons & controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid transparent;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn--brand{background:var(--brand);color:var(--on-brand)}
.btn--brand:hover{background:var(--brand-press)}
.btn--ink{background:var(--ink);color:var(--paper)}
.btn--line{background:var(--card);border-color:var(--line-2);color:var(--ink)}
.btn--line:hover{border-color:var(--ink)}
.btn--ghost{background:transparent;color:var(--ink)}
.btn--ghost:hover{background:var(--tile)}
.btn--danger{background:transparent;color:var(--danger);border-color:var(--danger-line)}
.btn--danger:hover{background:var(--danger-tint)}
.btn--sm{min-height:36px;padding:0 14px;font-size:14px}
.btn--block{width:100%}
.btn--lg{min-height:52px;font-size:16px}
.btn[disabled],.btn.is-disabled{opacity:.45;pointer-events:none}
.btn .spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:999px;border:0;background:transparent;color:var(--ink)}
.iconbtn:hover{background:var(--tile)}
.iconbtn--sm{width:34px;height:34px}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.field{display:flex;flex-direction:column;gap:6px}
.field__label{font-weight:600;font-size:14px}
.field__opt{font-weight:400;color:var(--ink-3)}
.field__hint{font-size:13px;color:var(--ink-3)}
.field__err{font-size:13px;color:var(--danger);font-weight:600}
.input,.select,.textarea{width:100%;min-height:46px;padding:10px 14px;border:1.5px solid var(--line-2);border-radius:var(--r-sm);background:var(--card);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.textarea{min-height:84px;resize:vertical;line-height:1.45}
.input:focus,.select:focus,.textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.input.is-bad,.textarea.is-bad{border-color:var(--danger)}
.input--pre{display:flex;align-items:stretch;border:1.5px solid var(--line-2);border-radius:var(--r-sm);background:var(--card);overflow:hidden}
.input--pre span{display:grid;place-items:center;padding:0 12px;background:var(--tile);color:var(--ink-2);font-weight:600;font-size:14px}
.input--pre input{border:0;min-height:44px;padding:8px 12px;flex:1;min-width:0;background:transparent;outline:none}
.input--pre:focus-within{border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.row--between{justify-content:space-between}
.row--wrap{flex-wrap:wrap}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:13px}

.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch__track{width:44px;height:26px;border-radius:999px;background:var(--line-2);position:relative;transition:background-color .2s;flex:none}
.switch__track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+.switch__track{background:var(--green)}
.switch input:checked+.switch__track::after{transform:translateX(18px)}
.switch input:focus-visible+.switch__track{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px}
.switch__text{font-weight:600;font-size:14px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.3;white-space:nowrap}
.badge--new{background:var(--brand);color:var(--on-brand)}
.badge--done{background:var(--green-tint);color:var(--green)}
.badge--off{background:var(--tile);color:var(--ink-2)}
.badge--warn{background:var(--amber-tint);color:var(--amber)}
.badge--soft{background:var(--brand-tint);color:var(--brand)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex:none}

.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line-2);border-radius:999px;background:var(--card);height:40px}
.qty button{width:38px;height:100%;border:0;background:none;display:grid;place-items:center;color:var(--ink);border-radius:999px}
.qty button:hover{background:var(--tile)}
.qty button[disabled]{opacity:.35}
.qty output{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.qty--lg{height:48px}
.qty--lg button{width:46px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md)}
.card__pad{padding:20px}
.price{font-family:var(--f-display);font-size:18px;color:var(--brand);line-height:1;white-space:nowrap}
.price__from{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--ink-3);margin-right:4px}
.price s{font-family:var(--f-body);font-size:13px;color:var(--ink-3);font-weight:500;margin-left:6px}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--card);border-bottom:1px solid var(--line)}
.hdr__in{display:flex;align-items:center;gap:28px;height:var(--hdr-h)}
.hdr__logo{display:flex;align-items:center;height:100%;padding:6px 0;flex:0 1 auto;min-width:0;text-decoration:none}
.logo{height:56px;width:auto;object-fit:contain}
.logo--dark{display:none}
:root[data-theme="dark"] .logo--light{display:none}
:root[data-theme="dark"] .logo--dark{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo--light{display:none}:root:not([data-theme="light"]) .logo--dark{display:block}}
.logo-plate{background:#fff;border-radius:10px;padding:3px 6px}
.hdr__nav{display:flex;gap:6px}
.hdr__nav a{text-decoration:none;font-weight:700;padding:8px 14px;border-radius:999px;color:var(--ink-2)}
.hdr__nav a:hover{color:var(--ink);background:var(--tile)}
.hdr__nav a.is-on{color:var(--ink);background:var(--tile)}
.hdr__right{margin-left:auto;display:flex;align-items:center;gap:10px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;white-space:nowrap}
.status--open{background:var(--green-tint);color:var(--green)}
.status--closed{background:var(--danger-tint);color:var(--danger)}
.status--open .dot{box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}
.acct{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;padding:8px 12px;border-radius:999px}
.acct:hover{background:var(--tile)}
.cartbtn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;background:var(--brand);color:var(--on-brand);font-weight:700;height:44px;padding:0 16px 0 12px;border-radius:999px}
.cartbtn:hover{background:var(--brand-press)}
.cartbtn__icon{position:relative;display:grid}
.cartbtn__count{position:absolute;top:-7px;right:-9px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--card);color:var(--brand);font-size:11.5px;font-weight:800;display:grid;place-items:center;border:2px solid var(--brand)}
.cartbtn.bump .cartbtn__icon{animation:bump .45s ease}
@keyframes bump{30%{transform:scale(1.25) rotate(-8deg)}60%{transform:scale(.95)}}
.closedbar{background:var(--danger-tint);color:var(--ink);border-bottom:1px solid var(--danger-line)}
.closedbar__in{display:flex;align-items:center;gap:12px;padding:12px 20px;font-weight:600}
.closedbar__in .ico{color:var(--danger)}
.closedbar small{font-weight:500;color:var(--ink-2)}

/* ---------- page scaffolding ---------- */
.page{padding:28px 0 64px}
.sec{margin-top:44px}
.sec:first-child{margin-top:0}
.sec__head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.sec__title{font-family:var(--f-display);font-weight:400;font-size:26px}
.sec__more{font-weight:700;color:var(--brand);text-decoration:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.sec__more:hover{text-decoration:underline;text-underline-offset:3px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.pagehead h1{font-family:var(--f-display);font-weight:400;font-size:36px}
.pagehead p{color:var(--ink-2);margin-top:6px}
.crumb{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);text-decoration:none;font-weight:600;margin-bottom:10px}
.crumb:hover{color:var(--ink)}

/* ---------- home ---------- */
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:14px 0 0;color:var(--ink-2);font-size:14px}
.strip span{display:inline-flex;align-items:center;gap:7px}
.strip .ico{color:var(--ink-3)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.cat{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:176px;padding:16px 18px 18px;background:var(--brand);color:var(--on-brand);border-radius:var(--r-lg);text-decoration:none;overflow:hidden;isolation:isolate}
.cat:hover{background:var(--brand-press)}
.cat__art{width:78px;height:78px;margin-left:-4px}
.cat__art svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.cat:hover .cat__art svg{transform:rotate(-8deg) translateY(-2px)}
.cat__name{font-family:var(--f-display);font-size:23px;line-height:1.05;margin-top:10px}
.cat__count{font-size:13px;font-weight:600;opacity:.85;margin-top:4px}
.cat::after{content:"";position:absolute;right:-34px;top:-34px;width:120px;height:120px;border:3px solid rgba(255,255,255,.22);border-radius:50%;z-index:-1}
.promos{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
.promo{flex:none;scroll-snap-align:start;border:0;padding:0;border-radius:var(--r-md);overflow:hidden;background:var(--tile);height:340px;box-shadow:var(--shadow-1)}
.promo img{height:100%;width:auto;max-width:none}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.info__item{padding:20px;display:flex;flex-direction:column;gap:8px}
.info__k{display:flex;align-items:center;gap:8px;font-weight:700}
.info__k .ico{color:var(--brand)}
.info__v{color:var(--ink-2)}
.info__v a{font-weight:700;color:var(--ink);text-decoration:none}
.info__v a:hover{text-decoration:underline}

/* ---------- product & deal cards ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid--3{grid-template-columns:repeat(3,1fr)}
.pcard{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .2s}
.pcard:hover{border-color:var(--line-2);box-shadow:var(--shadow-1)}
.pcard__media{position:relative;aspect-ratio:4/3;background:var(--tile)}
.pcard__media img{width:100%;height:100%;object-fit:contain;padding:8px}
.pcard__flag{position:absolute;left:10px;top:10px}
.pcard__body{flex:1;display:flex;flex-direction:column;gap:6px;padding:14px 14px 14px}
.pcard__name{font-size:16px;font-weight:700;line-height:1.25}
.pcard__desc{font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.pcard__foot{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pcard.is-off .pcard__media img{filter:grayscale(1);opacity:.55}
.addbtn{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 14px 0 10px;border-radius:999px;border:0;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:14px}
.addbtn:hover{background:var(--brand-press)}
.addbtn[disabled]{background:var(--tile);color:var(--ink-3);cursor:not-allowed}
.noimg{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-3)}
.noimg svg{width:44%;max-width:96px;height:auto;fill:none;stroke:var(--brand);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.noimg span{font-size:12px;font-weight:600}
.dcard__items{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--ink-2)}
.dcard__items li{display:flex;gap:7px}
.dcard__items b{color:var(--ink);font-weight:800;min-width:14px}
.tag{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:700}
.tag--brand{background:var(--brand);color:var(--on-brand)}

/* ---------- menu ---------- */
.chips{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr-h));z-index:30;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-bottom:8px}
.chips__in{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;scrollbar-width:none;max-width:1200px;margin:0 auto}
.chips__in::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--card);font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.chip:hover{border-color:var(--ink)}
.chip.is-on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip__n{font-weight:600;opacity:.6;font-size:12.5px}
.msec{padding-top:26px}
.msec__title{font-family:var(--f-display);font-weight:400;font-size:28px;margin-bottom:4px}
.msec__sub{color:var(--ink-2);margin-bottom:16px}
.msub{font-weight:800;font-size:16px;margin:22px 0 12px;display:flex;align-items:center;gap:10px}
.msub::after{content:"";height:1px;background:var(--line);flex:1}
.msec.is-disabled{opacity:.5}

/* ---------- modal / sheet ---------- */
.ov{position:fixed;inset:0;z-index:100;background:rgba(24,18,18,.5);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .2s}
.ov.is-in{opacity:1}
.mdl{position:relative;width:100%;max-width:560px;max-height:calc(100% - 20px);overflow-y:auto;overflow-x:hidden;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);transform:translateY(16px) scale(.98);transition:transform .25s cubic-bezier(.2,.9,.3,1.1)}
.ov.is-in .mdl{transform:none}
.mdl--lg{max-width:760px}
.mdl--xl{max-width:900px}
.mdl--sm{max-width:420px}
.mdl__x{position:absolute;top:12px;right:12px;z-index:2;background:var(--card);box-shadow:var(--shadow-1)}
.mdl__head{padding:22px 24px 0}
.mdl__head h2{font-family:var(--f-display);font-weight:400;font-size:24px;padding-right:40px}
.mdl__head p{color:var(--ink-2);margin-top:6px}
.mdl__body{padding:18px 24px}
.mdl__foot{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;padding:14px 24px;background:var(--card);border-top:1px solid var(--line)}
.pm{display:grid;grid-template-columns:minmax(0,1fr)}
.pm__media{background:var(--tile);aspect-ratio:16/10;display:grid;place-items:center}
.pm__media img{width:100%;height:100%;object-fit:contain;padding:14px}
.pm__body{padding:20px 24px 4px}
.pm__name{font-family:var(--f-display);font-weight:400;font-size:28px;padding-right:20px}
.pm__desc{color:var(--ink-2);margin-top:8px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.opt{position:relative;display:flex;flex-direction:column;gap:2px;padding:10px 14px;border:1.5px solid var(--line-2);border-radius:var(--r-sm);cursor:pointer;background:var(--card)}
.opt input{position:absolute;opacity:0}
.opt__l{font-weight:700;font-size:14px}
.opt__p{font-size:13.5px;color:var(--ink-2);font-weight:600}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-tint);box-shadow:inset 0 0 0 1px var(--brand)}
.opt:has(input:focus-visible){outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px}
.pm__label{font-weight:800;margin-top:20px;display:flex;justify-content:space-between;align-items:baseline}
.pm__foot{display:flex;gap:12px;align-items:center;padding:16px 24px 20px;position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);margin-top:20px}
.pm__foot .btn{flex:1}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);background:var(--tile);color:var(--ink-2);font-size:14px}
.note .ico{flex:none;margin-top:1px}
.note--danger{background:var(--danger-tint);color:var(--ink)}
.note--danger .ico{color:var(--danger)}
.note--amber{background:var(--amber-tint);color:var(--ink)}
.note--amber .ico{color:var(--amber)}
.note--green{background:var(--green-tint);color:var(--ink)}
.note--green .ico{color:var(--green)}

/* ---------- toasts ---------- */
.toasts{position:fixed;z-index:120;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,calc(100% - 24px))}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;width:100%;padding:12px 12px 12px 16px;border-radius:14px;background:var(--ink);color:var(--paper);box-shadow:var(--shadow-pop);font-weight:600;animation:tin .3s cubic-bezier(.2,.9,.3,1.2)}
:root[data-theme="dark"] .toast{background:#F2EFEF;color:#1A1819}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:#F2EFEF;color:#1A1819}}
.toast .ico{color:#5BD394;flex:none}
.toast__msg{flex:1;font-size:14px}
.toast__act{background:none;border:0;color:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:6px;white-space:nowrap}
.toast.out{animation:tout .25s forwards}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(10px)}}

/* ---------- cart ---------- */
.cartlay{display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start}
.cl{display:flex;flex-direction:column}
.ci{display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.ci:last-child{border-bottom:0}
.ci__img{width:96px;height:76px;border-radius:10px;background:var(--tile);overflow:hidden}
.ci__img img{width:100%;height:100%;object-fit:contain;padding:4px}
.ci__img .noimg svg{width:56%}
.ci__img .noimg span{display:none}
.ci__name{font-weight:700}
.ci__opt{font-size:13.5px;color:var(--ink-2)}
.ci__unit{font-size:13.5px;color:var(--ink-3);margin-top:2px}
.ci__ctl{display:flex;align-items:center;gap:10px;margin-top:10px}
.ci__total{font-family:var(--f-display);font-size:17px;text-align:right;white-space:nowrap}
.ci__rm{color:var(--ink-3)}
.ci__rm:hover{color:var(--brand);background:var(--brand-tint)}
.ci.is-off .ci__name::after{content:" (unavailable)";color:var(--danger);font-weight:600;font-size:13px}
.sum{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr-h) + 20px)}
.sum__rows{display:flex;flex-direction:column;gap:10px;padding:18px 20px}
.sum__row{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.sum__row span:last-child{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.sum__row--disc span:last-child{color:var(--green)}
.sum__row--bad{font-size:13px;color:var(--ink-3)}
.sum__total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 20px;border-top:1.5px dashed var(--line-2)}
.sum__total b{font-weight:800;font-size:16px}
.sum__total span{font-family:var(--f-display);font-size:26px;color:var(--brand)}
.sum__cta{padding:0 20px 20px;display:flex;flex-direction:column;gap:10px}
.promo-in{display:flex;gap:8px}
.promo-in .input{text-transform:uppercase;min-height:42px}
.offers{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.offer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1.5px dashed var(--line-2);border-radius:var(--r-sm);font-size:13.5px}
.offer b{font-weight:800;letter-spacing:.02em}
.applied{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 8px 12px;background:var(--green-tint);border-radius:var(--r-sm);font-size:14px}
.applied.is-bad{background:var(--amber-tint)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:56px 24px}
.empty__art{width:120px;height:120px;color:var(--brand)}
.empty__art svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.empty h2{font-family:var(--f-display);font-weight:400;font-size:24px}
.empty p{color:var(--ink-2);max-width:380px}

/* ---------- checkout ---------- */
.co{display:grid;grid-template-columns:1fr 400px;gap:24px;align-items:start}
.co__sec{padding:22px 24px}
.co__sec+.co__sec{border-top:1px solid var(--line)}
.co__h{font-weight:800;font-size:18px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.co__n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:13px;font-weight:800}
.pay{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px solid var(--brand);background:var(--brand-tint);border-radius:var(--r-sm)}
.pay__ic{width:42px;height:42px;border-radius:10px;background:var(--card);display:grid;place-items:center;color:var(--brand)}
.pay b{display:block}
.mini{display:flex;flex-direction:column;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line);max-height:320px;overflow:auto}
.mini__row{display:flex;gap:10px;font-size:14px}
.mini__q{font-weight:800;min-width:24px}
.mini__n{flex:1}
.mini__n small{display:block;color:var(--ink-3)}
.mini__p{font-weight:600;white-space:nowrap}
.mbar{display:none}

/* ---------- confirmation ---------- */
.done{max-width:640px;margin:0 auto;text-align:center}
.done__check{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;background:var(--green);display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.done__check svg{width:44px;height:44px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.done__check path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .45s .25s forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.done h1{font-family:var(--f-display);font-weight:400;font-size:34px}
.done__no{display:inline-block;margin-top:12px;padding:8px 18px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:800;font-size:18px;letter-spacing:.02em}
.done__card{text-align:left;margin-top:26px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:10px 16px;padding:18px 22px;font-size:14.5px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:600}

/* ---------- account ---------- */
.auth{max-width:440px;margin:0 auto}
.tabs{display:flex;gap:4px;padding:4px;background:var(--tile);border-radius:999px;margin-bottom:20px}
.tabs button,.tabs a{flex:1;height:40px;border:0;border-radius:999px;background:transparent;font-weight:700;color:var(--ink-2);text-decoration:none;display:grid;place-items:center;padding:0 14px;white-space:nowrap}
.tabs .is-on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-1)}
.acctlay{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.ord{border-bottom:1px solid var(--line)}
.ord:last-child{border-bottom:0}
.ord summary{list-style:none;display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:16px 20px;cursor:pointer}
.ord summary::-webkit-details-marker{display:none}
.ord summary .ico{transition:transform .2s;color:var(--ink-3)}
.ord[open] summary .ico{transform:rotate(180deg)}
.ord__no{font-weight:800}
.ord__meta{font-size:13.5px;color:var(--ink-2)}
.ord__body{padding:0 20px 18px}
.ord__body .mini{padding:0 0 12px;border:0;max-height:none}

/* ---------- bottom nav (mobile) ---------- */
.bnav{display:none}
.vcart{display:none}

/* ---------- footer ---------- */
.foot{border-top:1px solid var(--line);background:var(--card);margin-top:20px}
.foot__in{display:flex;flex-wrap:wrap;align-items:center;gap:20px 40px;padding:28px 20px}
.foot__logo{height:52px;width:auto}
.foot__col{font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.foot__col b{color:var(--ink)}
.foot__copy{margin-left:auto;font-size:13px;color:var(--ink-3)}

/* =================== ADMIN =================== */
.adm{display:grid;grid-template-columns:252px 1fr;min-height:calc(100% - 38px)}
.adm{background:linear-gradient(90deg,var(--side) 252px,transparent 252px)}
.adm-side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:calc(100dvh - 38px);overflow:auto}
.adm-side__logo{display:flex;align-items:center;gap:12px;padding:18px 20px 14px}
.adm-side__logo img{height:50px;width:auto}
.adm-side__logo b{display:block;font-size:14px}
.adm-side__logo small{color:var(--side-mute);font-size:12px}
.adm-nav{display:flex;flex-direction:column;gap:2px;padding:8px 12px}
.adm-nav__grp{font-size:12px;color:var(--side-mute);padding:16px 10px 6px;font-weight:600}
.adm-nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--side-ink);font-weight:600;font-size:14.5px}
.adm-nav a .ico{color:var(--side-mute)}
.adm-nav a:hover{background:var(--side-hover)}
.adm-nav a.is-on{background:var(--side-active);box-shadow:inset 3px 0 0 color-mix(in srgb,var(--b-brand,#2F5BD3) 70%,#fff)}
.adm-nav a.is-on .ico{color:color-mix(in srgb,var(--b-brand,#2F5BD3) 55%,#fff)}
.adm-nav a.is-sub{padding-left:44px;font-size:14px}
.adm-nav__count{margin-left:auto;background:var(--brand);color:var(--on-brand);font-size:11.5px;font-weight:800;min-width:22px;height:20px;border-radius:999px;display:grid;place-items:center;padding:0 6px}
.adm-side__foot{margin-top:auto;padding:14px 12px 18px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:2px}
.adm-side__foot a,.adm-side__foot button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-ink);text-decoration:none;font-weight:600;font-size:14px;background:none;border:0;text-align:left}
.adm-side__foot a:hover,.adm-side__foot button:hover{background:var(--side-hover)}
.adm-main{min-width:0;display:flex;flex-direction:column}
.adm-top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;height:68px;padding:0 28px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.adm-top h1{font-family:var(--f-display);font-weight:400;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-top__r{margin-left:auto;display:flex;align-items:center;gap:10px}
.adm-burger{display:none}
.stt{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 8px 0 14px;border-radius:999px;border:1.5px solid;font-weight:800;font-size:14px;background:var(--card)}
.stt--open{border-color:color-mix(in srgb,var(--green) 45%,transparent);color:var(--green)}
.stt--closed{border-color:var(--danger-line);color:var(--danger)}
.stt .switch__track{width:48px;height:28px}
.stt .switch input:checked+.switch__track::after{transform:translateX(20px)}
.stt .switch__track::after{width:22px;height:22px}
.bell{position:relative}
.bell__n{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:999px;background:var(--brand);color:var(--on-brand);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--paper)}
.bell.ring .ico{animation:ring .9s ease}
@keyframes ring{10%,30%,50%{transform:rotate(14deg)}20%,40%{transform:rotate(-14deg)}60%{transform:none}}
.drop{position:absolute;right:0;top:calc(100% + 8px);width:340px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-pop);z-index:50;overflow:hidden}
.drop__h{padding:14px 16px;font-weight:800;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.drop a{display:flex;gap:12px;padding:12px 16px;text-decoration:none;border-bottom:1px solid var(--line)}
.drop a:hover{background:var(--tile)}
.drop a:last-child{border-bottom:0}
.adm-body{padding:28px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
.adm-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md)}
.adm-card__h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.adm-card__h h2{font-size:17px;font-weight:800}
.adm-card__h p{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.adm-card__b{padding:20px}
.statusbig{display:flex;align-items:center;gap:20px;padding:22px 24px;border-radius:var(--r-md);border:1.5px solid}
.statusbig--open{background:var(--green-tint);border-color:color-mix(in srgb,var(--green) 35%,transparent)}
.statusbig--closed{background:var(--danger-tint);border-color:var(--danger-line)}
.statusbig__ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.statusbig--open .statusbig__ic{background:var(--green)}
.statusbig--closed .statusbig__ic{background:var(--danger)}
.statusbig h2{font-family:var(--f-display);font-weight:400;font-size:24px}
.statusbig p{color:var(--ink-2);margin-top:2px}
.statusbig .btn{margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:6px;text-decoration:none}
a.stat:hover{border-color:var(--line-2)}
.stat__k{font-size:13.5px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:8px}
.stat__v{font-family:var(--f-display);font-size:30px;line-height:1.05}
.stat--hot{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.stat--hot .stat__k{color:inherit;opacity:.88}
.dash{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}
.olist a{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);text-decoration:none}
.olist a:last-child{border-bottom:0}
.olist a:hover{background:var(--tile)}
.olist__no{font-weight:800}
.olist__who{font-size:14px;color:var(--ink-2)}
.olist__amt{font-family:var(--f-display);font-size:17px}
.unread{width:9px;height:9px;border-radius:50%;background:var(--brand);display:inline-block;box-shadow:0 0 0 3px var(--brand-tint)}
.qa{display:flex;flex-direction:column}
.qa a,.qa button{display:flex;align-items:center;gap:14px;padding:14px 20px;border:0;border-bottom:1px solid var(--line);background:none;text-decoration:none;text-align:left;font-weight:700;width:100%}
.qa a:last-child,.qa button:last-child{border-bottom:0}
.qa a:hover,.qa button:hover{background:var(--tile)}
.qa__ic{width:38px;height:38px;border-radius:10px;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;flex:none}
.qa small{display:block;font-weight:500;color:var(--ink-2);font-size:13px}
.qa .ico:last-child{margin-left:auto;color:var(--ink-3)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .search{position:relative;flex:1;min-width:200px;max-width:360px}
.toolbar .search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.toolbar .search input{padding-left:40px;min-height:42px}
.toolbar .select{width:auto;min-height:42px}
.toolbar__r{margin-left:auto;display:flex;gap:10px}
.segs{display:inline-flex;gap:4px;padding:4px;background:var(--tile);border-radius:999px}
.segs a,.segs button{height:34px;padding:0 14px;border-radius:999px;border:0;background:none;font-weight:700;font-size:14px;color:var(--ink-2);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.segs .is-on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-1)}
.segs__n{font-size:12px;background:var(--brand);color:var(--on-brand);border-radius:999px;padding:1px 7px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12.5px;color:var(--ink-3);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.is-click{cursor:pointer}
.tbl tbody tr.is-click:hover td{background:var(--tile)}
.tbl tr.is-unread td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.thumb{width:56px;height:44px;border-radius:8px;background:var(--tile);overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:contain;padding:2px}
.thumb .noimg span{display:none}
.thumb .noimg svg{width:60%}
.cellname{display:flex;align-items:center;gap:12px}
.cellname b{display:block;font-weight:700}
.cellname small{color:var(--ink-3)}
.acts{display:flex;gap:4px;justify-content:flex-end}
.star{color:var(--ink-3)}
.star.is-on{color:#E2A400}
.star.is-on .ico{fill:#F4B400}
.catrow{display:grid;grid-template-columns:auto 52px 1fr auto auto;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow__mv{display:flex;flex-direction:column}
.catrow__mv button{height:22px;width:30px;border:0;background:none;border-radius:6px;color:var(--ink-2);display:grid;place-items:center}
.catrow__mv button:hover{background:var(--tile)}
.catrow__mv button[disabled]{opacity:.25}
.catrow__art{width:52px;height:52px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.catrow__art svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.catrow.is-off .catrow__art{background:var(--line-2)}
.catrow b{font-weight:800}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.adeal{display:flex;flex-direction:column;overflow:hidden}
.adeal__media{position:relative;aspect-ratio:16/10;background:var(--tile)}
.adeal__media img{width:100%;height:100%;object-fit:contain}
.adeal__media .tag{position:absolute;left:10px;top:10px}
.adeal__b{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.adeal__f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 10px 16px;border-top:1px solid var(--line)}

    else if (subtotal < d.minOrder) why = `Add ${money(roundMoney(d.minOrder - subtotal))} more to use this code.`;
    const amt = why ? 0 : (d.type === 'percent' ? roundMoney(subtotal * d.value / 100) : Math.min(+d.value, subtotal));
    return { d, why, amt };
  }).filter(Boolean);
  const discount = roundMoney(Math.min(subtotal, applied.reduce((s, a) => s + a.amt, 0)));
  const fee = live.length ? +S.settings.deliveryFee : 0;
  return { lines, live, subtotal, hasDeal, applied, discount, fee, total: roundMoney(Math.max(0, subtotal - discount + fee)), count: live.reduce((s, l) => s + l.qty, 0), blocked: lines.some(l => !l.ok) };

}
function applyCode(raw) {
  const code = String(raw || '').trim().toUpperCase();

  const d = S.discounts.find(x => x.code.toUpperCase() === code);
  if (!d || !d.enabled) return { err: "This code isn't valid. Check the spelling and try again." };
  if (S.cart.codes.includes(d.id)) return { err: 'This code is already applied.' };
  const t = totals();
  if (t.hasDeal && !d.stackable) return { err: "This code can't be combined with deals. Only one deal or discount applies per order." };
  if (t.subtotal < d.minOrder) return { err: `Add ${money(roundMoney(d.minOrder - t.subtotal))} more to use this code.` };
  let note = '';
  if (S.cart.codes.length) {
    const others = S.cart.codes.map(discBy).filter(Boolean);
    if (!d.stackable || others.some(o => !o.stackable)) { note = `Only one discount applies per order, so ${others.map(o => o.code).join(', ')} was replaced.`; S.cart.codes = []; }
  }
  S.cart.codes.push(d.id); save();

}

const modalRoot = document.getElementById('modal');

let lastFocus = null;
const Modal = {
  open(html, { size = 'md', label = 'Dialog' } = {}) {
    lastFocus = document.activeElement;

  },
  set(html) { const m = $('.mdl', modalRoot); if (m) m.innerHTML = html; },
  close() {

function toast(msg, { icon: ic = 'check', action = null, label = '', ms = 3400 } = {}) {
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = `${icon(ic)}<span class="toast__msg">${esc(msg)}</span>${action ? `<button class="toast__act" type="button">${esc(label)}</button>` : ''}`;
  if (action) el.querySelector('.toast__act').onclick = () => { action(); kill(); };
  toastRoot.appendChild(el);
  while (toastRoot.children.length > 3) toastRoot.firstElementChild.remove();
  const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 260); };

let AC;
function chime() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    [[784, 0], [1046.5, .14], [1318.5, .28]].forEach(([f, d]) => {
      const o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.22, t + d + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + .6);
      o.connect(g); g.connect(AC.destination); o.start(t + d); o.stop(t + d + .65);
    });
  } catch (e) { }
}

function fieldErr(form, name, msg) {

function readFile(input, max = 900) {
  return new Promise((res, rej) => {
    const f = input.files && input.files[0]; if (!f) return rej('none');
    if (!/^image\//.test(f.type)) return rej('type');
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const s = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas');
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        const isPng = /png|svg|webp/.test(f.type); res(c.toDataURL(isPng ? 'image/png' : 'image/jpeg', .86));
      };
      im.onerror = () => rej('decode'); im.src = r.result;
    };
    r.onerror = () => rej('read'); r.readAsDataURL(f);
  });
}

          <div class="ord__body"><div class="mini">${o.items.map(i => `<div class="mini__row"><span class="mini__q">${i.qty}×</span><span class="mini__n">${esc(i.name)}${i.option ? `<small>${esc(i.option)}</small>` : ''}</span><span class="mini__p">${money(i.unit * i.qty)}</span></div>`).join('')}</div>
          <div class="small muted">Delivered to ${esc(o.address)}. Paid by cash on delivery.</div>

          : `<div class="empty"><div class="empty__art">${art('bag')}</div><h2>No orders yet</h2><p>Your orders will show up here after checkout.</p><a class="btn btn--brand" href="#/menu">Browse menu</a></div>`}

/* ---------- product & deal sheets ---------- */
let PM = null;
function productSheet() {
  const p = prod(PM.id); if (!p) return '';
  const o = p.options[PM.opt] || p.options[0]; const u = unitPrice(o);
  const off = !p.available, closed = !canOrder();
  return `${closeX()}<div class="pm">
    <div class="pm__media">${imgOrArt(p.img, prodArt(p), p.name)}</div>
    <div class="pm__body"><h2 class="pm__name">${esc(p.name)}</h2><p class="pm__desc">${esc(p.desc)}</p>
      ${p.options.length > 1 ? `<div class="pm__label"><span>Choose size</span><span class="small faint">Required</span></div>
        <div class="opts" role="radiogroup" aria-label="Size">${p.options.map((x, i) => `<label class="opt"><input type="radio" name="pm-opt" value="${i}" ${i === PM.opt ? 'checked' : ''} data-chg="pm-opt"><span class="opt__l">${esc(x.label)}</span><span class="opt__p">${money(unitPrice(x))}${unitPrice(x) < +x.price ? ` <s>${money(x.price)}</s>` : ''}</span></label>`).join('')}</div>`
        : `<div class="pm__label"><span class="price" style="font-size:24px">${money(u)}${u < +o.price ? `<s>${money(o.price)}</s>` : ''}</span></div>`}
      ${off ? `<div class="note note--amber" style="margin-top:16px">${icon('alert')}<span>This item is currently unavailable.</span></div>` : closed ? `<div class="note note--danger" style="margin-top:16px">${icon('clock')}<span>${esc(S.settings.closedMsg)}</span></div>` : ''}
    </div>
    <div class="pm__foot"><div class="qty qty--lg" role="group" aria-label="Quantity"><button type="button" data-act="pm-dec" ${PM.qty <= 1 ? 'disabled' : ''} aria-label="Decrease">${icon('minus')}</button><output>${PM.qty}</output><button type="button" data-act="pm-inc" aria-label="Increase" ${PM.qty >= 50 ? 'disabled' : ''}>${icon('plus')}</button></div>
      <button class="btn btn--brand btn--lg" type="button" data-act="pm-add" ${off || closed ? 'disabled' : ''}>${off ? 'Unavailable' : closed ? 'Ordering is closed' : `Add <span class="lg-only">to cart, </span><span class="sm-only">for </span>${money(u * PM.qty)}`}</button></div></div>`;
}
function dealSheet() {
  const d = dealBy(PM.id); if (!d) return ''; const closed = !canOrder();
  return `${closeX()}<div class="pm">
    <div class="pm__media">${imgOrArt(d.img, 'deal', d.name)}</div>
    <div class="pm__body"><span class="tag">${esc(d.group)}</span><h2 class="pm__name" style="margin-top:10px">${esc(d.name)}</h2>${d.desc ? `<p class="pm__desc">${esc(d.desc)}</p>` : ''}
      <div class="pm__label"><span>What's included</span></div>
      <ul class="dcard__items" style="font-size:15px;gap:8px;margin-top:10px">${d.items.map(i => `<li><span style="color:var(--green)">${icon('check', 'ico--sm')}</span><b>${i.qty}</b><span>${esc(i.name)}</span></li>`).join('')}</ul>
      <div class="pm__label"><span class="price" style="font-size:26px">${money(d.price)}</span></div>
      <p class="small faint" style="margin-top:8px">Deals can't be combined with promo codes.</p>
      ${closed ? `<div class="note note--danger" style="margin-top:14px">${icon('clock')}<span>${esc(S.settings.closedMsg)}</span></div>` : ''}
    </div>
    <div class="pm__foot"><div class="qty qty--lg" role="group" aria-label="Quantity"><button type="button" data-act="pm-dec" ${PM.qty <= 1 ? 'disabled' : ''} aria-label="Decrease">${icon('minus')}</button><output>${PM.qty}</output><button type="button" data-act="pm-inc" aria-label="Increase">${icon('plus')}</button></div>
      <button class="btn btn--brand btn--lg" type="button" data-act="pm-add" ${closed ? 'disabled' : ''}>${closed ? 'Ordering is closed' : `Add <span class="lg-only">to cart, </span><span class="sm-only">for </span>${money(d.price * PM.qty)}`}</button></div></div>`;
}
const refreshSheet = () => Modal.set(PM.kind === 'p' ? productSheet() : dealSheet());
ACT['open-product'] = el => { const p = prod(el.dataset.id); if (!p) return; const i = p.options.findIndex(o => o.label.startsWith('Large')); PM = { kind: 'p', id: p.id, opt: i >= 0 ? i : 0, qty: 1 }; Modal.open(productSheet(), { size: 'prod', label: p.name }); };
ACT['open-deal'] = el => { const d = dealBy(el.dataset.id); if (!d) return; PM = { kind: 'd', id: d.id, opt: 0, qty: 1 }; Modal.open(dealSheet(), { size: 'prod', label: d.name }); };
CHG['pm-opt'] = el => { PM.opt = +el.value; refreshSheet(); const r = $(`.opt input[value="${PM.opt}"]`, modalRoot); r && r.focus(); };
ACT['pm-inc'] = () => { PM.qty = Math.min(50, PM.qty + 1); refreshSheet(); };
ACT['pm-dec'] = () => { PM.qty = Math.max(1, PM.qty - 1); refreshSheet(); };
ACT['pm-add'] = () => {
  const name = PM.kind === 'p' ? prod(PM.id).name + (prod(PM.id).options.length > 1 ? ' (' + prod(PM.id).options[PM.opt].label + ')' : '') : dealBy(PM.id).name;
  if (addToCart(PM.kind, PM.id, PM.opt, PM.qty)) { Modal.close(); toast(`Added ${PM.qty > 1 ? PM.qty + ' × ' : ''}${name}`, { action: () => go('#/cart'), label: 'View cart' }); }
};
ACT['quick-add'] = el => {
  const p = prod(el.dataset.id); if (!p) return;
  if (p.options.length > 1) return ACT['open-product'](el);
  if (addToCart('p', p.id, 0, 1)) toast(`Added ${p.name}`, { action: () => go('#/cart'), label: 'View cart' });
};
ACT['quick-add-deal'] = el => { const d = dealBy(el.dataset.id); if (d && addToCart('d', d.id, 0, 1)) toast(`Added ${d.name}`, { action: () => go('#/cart'), label: 'View cart' }); };
ACT['chip'] = el => { const s = document.getElementById('cat-' + el.dataset.cat); if (s) { s.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); history.replaceState(null, '', '#/menu?c=' + el.dataset.cat); } };
const findLine = k => S.cart.items.find(i => i.key === k);
ACT['cart-inc'] = el => { const i = findLine(el.dataset.key); if (i) { i.qty = Math.min(50, i.qty + 1); commit(); } };
ACT['cart-dec'] = el => { const i = findLine(el.dataset.key); if (!i) return; if (i.qty > 1) { i.qty--; commit(); } else ACT['cart-rm'](el); };
ACT['cart-rm'] = el => {

FORM['checkout'] = f => {
  const D = CO_DRAFT; let bad = null;
  const chk = (n, msg) => { fieldErr(f, n, msg); if (msg && !bad) bad = n; };
  chk('name', D.name.trim().length < 2 ? 'Enter your name.' : '');
  chk('phone', !validPhone(D.phone) ? phoneErr() : '');
  chk('address', D.address.trim().length < 8 ? 'Enter your full delivery address.' : '');
  if (bad) { const el = f.querySelector(`[name="${bad}"]`); el.focus(); return; }
  if (!canOrder()) return toast("We're closed right now, so ordering is paused.", { icon: 'clock' });
  $$('[data-place]', f).forEach(b => { b.disabled = true; b.innerHTML = '<span class="spin"></span>Placing order'; });
  setTimeout(() => {
    const t = totals(); const u = me(); const no = S.nextNo++;
    const order = {
      no, at: Date.now(), name: D.name.trim(), phone: digits(D.phone), address: D.address.trim(), instructions: D.instructions.trim(), note: D.note.trim(), customerId: u ? u.id : null,
      items: t.live.map(l => ({ kind: l.kind, name: l.name, option: l.isDeal ? '' : l.option, qty: l.qty, unit: l.unit })),
      subtotal: t.subtotal, discount: t.discount, discountLabel: t.applied.filter(a => !a.why).map(a => `${a.d.code} (${discLabel(a.d)})`).join(', '), fee: t.fee, total: t.total,
      payment: 'Cash on Delivery', status: 'new', read: false, notified: false, completedAt: null

    S.orders.unshift(order);
    if (u && D.saveAddr) u.address = order.address;

};
FORM['login'] = f => {

  AUTH_MSG = ''; S.session.customerId = u.id; CO_DRAFT = null; save();

FORM['register'] = f => {
  let bad = false; const name = f.name.value.trim(), ph = f.phone.value, pw = f.password.value;
  fieldErr(f, 'name', name.length < 2 ? 'Enter your name.' : '') ; if (name.length < 2) bad = true;
  if (!validPhone(ph)) { fieldErr(f, 'phone', phoneErr()); bad = true; } else fieldErr(f, 'phone', '');
  if (pw.length < 6) { fieldErr(f, 'password', 'Use at least 6 characters.'); bad = true; } else fieldErr(f, 'password', '');
  if (bad) return;
  if (S.customers.some(c => c.phone === digits(ph))) { AUTH_MSG = 'An account with this number already exists. Log in instead.'; return render(); }

ACT['reorder'] = el => {

  o.items.forEach(i => {

    else { const p = S.products.find(x => x.name === i.name && x.available); if (p) { const k = Math.max(0, p.options.findIndex(x => x.label === i.option)); addToCart('p', p.id, k, i.qty); n++; } }

Cust.render = r => {
  const p = r.parts[0] || '';
  let body;
  if (p === 'menu') body = Cust.menu(r);
  else if (p === 'deals') body = Cust.deals(r);
  else if (p === 'cart') body = Cust.cart(r);
  else if (p === 'checkout') body = Cust.checkout(r);
  else if (p === 'order-placed') body = Cust.placed(r);
  else if (p === 'account') body = Cust.account(r);
  else body = Cust.home(r);
  const titles = { menu: 'Menu', deals: 'Deals', cart: 'Cart', checkout: 'Checkout', 'order-placed': 'Order placed', account: 'Account' };
  document.title = (titles[p] ? titles[p] + ', ' : '') + S.settings.name;
  return header(r) + body + footer() + viewCartBar(r) + bottomNav(r);
};
let spyObs = null;
Cust.after = r => {
  ntoastRoot.innerHTML = '';
  if (spyObs) { spyObs.disconnect(); spyObs = null; }
  if (r.parts[0] === 'menu' && 'IntersectionObserver' in window) {
    spyObs = new IntersectionObserver(ents => {
      ents.forEach(en => {
        if (!en.isIntersecting) return;
        const id = en.target.dataset.spy;
        $$('.chips .chip[data-cat]').forEach(c => c.classList.toggle('is-on', c.dataset.cat === id));
        const on = $(`.chips .chip[data-cat="${id}"]`); on && on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      });
    }, { rootMargin: '-35% 0px -60% 0px' });
    $$('[data-spy]').forEach(s => spyObs.observe(s));
  }
};

    <button class="btn btn--brand btn--sm btn--block" type="button">View order</button>`;
  const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 260); };
  el.querySelector('.iconbtn').onclick = kill;
  el.querySelector('.btn').onclick = () => { kill(); go('#/admin/orders/' + o.no); };
  ntoastRoot.prepend(el);
  while (ntoastRoot.children.length > 3) ntoastRoot.lastElementChild.remove();
}

  if (!S.session.admin) return;

}

function imgDims(src) { return new Promise(res => { const i = new Image(); i.onload = () => res({ w: i.naturalWidth, h: i.naturalHeight }); i.onerror = () => res({ w: 1, h: 1 }); i.src = src; }); }
/* turns a logo path into PNG data for the PDF. If the browser blocks it (for example when index.html is opened
   straight from your disk), the PDF shows the store name as text instead. */
function logoData(src) {
  if (/^data:image\/(png|jpe?g)/.test(src)) return Promise.resolve(src);
  return new Promise((res, rej) => {
    const i = new Image(); i.crossOrigin = 'anonymous';
    i.onload = () => { try { const c = document.createElement('canvas'); c.width = i.naturalWidth || 300; c.height = i.naturalHeight || 150; c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); res(c.toDataURL('image/png')); } catch (e) { rej(e); } };
    i.onerror = rej; i.src = src;
  });
}
async function buildPdf(o) {
  const { jsPDF } = window.jspdf; const s = S.settings;
  const doc = new jsPDF({ unit: 'mm', format: 'a5' }); const W = 148, M = 12; let y = 12;
  const red = hexRgb(themeVars(S.settings.brandColor || TH.brand, '')['--b-brand']) || [47, 91, 211], ink = [54, 52, 53], mute = [120, 115, 116];
  let lh = 0;
  if (curLogo()) {
    try { const logo = await logoData(curLogo()); const d = await imgDims(logo); lh = Math.min(30, 26 * d.h / d.w); doc.addImage(logo, /^data:image\/png/.test(logo) ? 'PNG' : 'JPEG', M, y, lh * d.w / d.h, lh); } catch (e) { lh = 0; }
  }
  if (!lh) { doc.setFont('helvetica', 'bold'); doc.setFontSize(17); doc.setTextColor(...red); const nm = doc.splitTextToSize(s.name, 72); doc.text(nm, M, y + 7); lh = 8 + nm.length * 6; }
  doc.setTextColor(...ink); doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text('Order #' + o.no, W - M, y + 6, { align: 'right' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...mute);
  [new Date(o.at).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }), s.name, ...doc.splitTextToSize(s.address, 70), 'Phone ' + s.phone].forEach((t, i) => doc.text(t, W - M, y + 12 + i * 4, { align: 'right' }));
  y += Math.max(lh, 30) + 3; doc.setDrawColor(...red); doc.setLineWidth(0.8); doc.line(M, y, W - M, y); y += 7;
  const field = (k, v, x, w) => { doc.setFontSize(7.5); doc.setTextColor(...mute); doc.text(k.toUpperCase(), x, y); doc.setFontSize(10); doc.setTextColor(...ink); const lines = doc.splitTextToSize(v || '-', w); doc.text(lines, x, y + 4.5); return 4.5 + lines.length * 4.4; };
  const h1 = field('Customer', o.name, M, 60); const h2 = field('Phone', fmtPhone(o.phone), 80, 56); y += Math.max(h1, h2) + 3;
  y += field('Delivery address', o.address, M, W - 2 * M) + 3;
  if (o.instructions) y += field('Delivery instructions', o.instructions, M, W - 2 * M) + 3;
  if (o.note) y += field('Order note', o.note, M, W - 2 * M) + 3;
  y += 2; doc.setFillColor(242, 239, 238); doc.rect(M, y - 4.5, W - 2 * M, 7, 'F');
  doc.setFontSize(8); doc.setTextColor(...mute); doc.setFont('helvetica', 'bold');
  doc.text('ITEM', M + 2, y); doc.text('QTY', 96, y, { align: 'right' }); doc.text('PRICE', 116, y, { align: 'right' }); doc.text('TOTAL', W - M - 2, y, { align: 'right' }); y += 7;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...ink);
  o.items.forEach(i => {
    const lines = doc.splitTextToSize(i.name + (i.option ? ' (' + i.option + ')' : '') + (i.kind === 'd' ? ' [Deal]' : ''), 72);
    if (y + lines.length * 4.4 > 190) { doc.addPage(); y = 16; }
    doc.text(lines, M + 2, y); doc.text(String(i.qty), 96, y, { align: 'right' }); doc.text(money(i.unit), 116, y, { align: 'right' }); doc.text(money(i.unit * i.qty), W - M - 2, y, { align: 'right' });
    y += lines.length * 4.4 + 2.2; doc.setDrawColor(235, 231, 231); doc.setLineWidth(0.2); doc.line(M, y - 3, W - M, y - 3);
  });
  if (y > 168) { doc.addPage(); y = 16; }
  y += 2; const tot = (k, v, bold) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(bold ? 12 : 9.5); doc.setTextColor(...(bold ? red : ink)); doc.text(k, 100, y, { align: 'right' }); doc.text(v, W - M - 2, y, { align: 'right' }); y += bold ? 7 : 5; };
  tot('Subtotal', money(o.subtotal)); tot('Discount' + (o.discountLabel ? ' (' + o.discountLabel.split(' ')[0] + ')' : ''), o.discount ? '- ' + money(o.discount) : money(0)); tot('Delivery fee', money(o.fee));
  doc.setDrawColor(...ink); doc.setLineWidth(0.5); doc.line(66, y - 2.5, W - M, y - 2.5); y += 2; tot('Final total', money(o.total), true);
  y += 2; doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...ink); doc.text('Payment: Cash on Delivery', M, y);
  doc.setFont('helvetica', 'normal'); doc.text('Status: ' + (o.status === 'new' ? 'New' : 'Completed'), W - M - 2, y, { align: 'right' });
  doc.setFontSize(7.5); doc.setTextColor(...mute); doc.text('Generated ' + new Date().toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) + ' from the ' + s.name + ' admin panel', M, 202);
  return doc.output('blob');
}
ACT['pdf-dl'] = async el => {
  const o = S.orders.find(x => x.no === +el.dataset.no); if (!o) return;

  el.disabled = true; const old = el.innerHTML; el.innerHTML = '<span class="spin"></span>Generating';
  try {

    else {

      catch (err) { const c = err && err.code; if (c === 'declined') toast('Download cancelled', { icon: 'info' }); else if (c === 'rate_limited') showNote('A download prompt is already open. Finish that one first.', 'note--amber'); else showNote("Downloads aren't available here right now.", 'note--amber'); }

  el.disabled = false; el.innerHTML = old;
};

function xfOpen(d) {
  const x = d || { id: '', name: '', code: '', type: 'percent', value: '', minOrder: 0, stackable: false, enabled: true };
  Modal.open(`${closeX()}<form data-form="xf" data-id="${x.id}" novalidate><div class="mdl__head"><h2>${x.id ? 'Edit discount' : 'Create discount'}</h2></div>
    <div class="mdl__body stack">
      <div class="grid2"><label class="field"><span class="field__label">Name</span><input class="input" name="name" value="${esc(x.name)}" placeholder="Summer offer" required autofocus></label>
        <label class="field"><span class="field__label">Code customers enter</span><input class="input" name="code" value="${esc(x.code)}" placeholder="SUMMER15" style="text-transform:uppercase" required></label></div>
      <div class="field"><span class="field__label">Type</span><div class="radios"><label class="radio"><input type="radio" name="type" value="percent" ${x.type === 'percent' ? 'checked' : ''} data-chg="xf-type">Percentage off</label><label class="radio"><input type="radio" name="type" value="fixed" ${x.type === 'fixed' ? 'checked' : ''} data-chg="xf-type">Fixed amount off</label></div></div>
      <div class="grid2"><label class="field"><span class="field__label">Value</span><div class="input--pre"><span id="xf-unit">${x.type === 'percent' ? '%' : esc(CUR.symbol)}</span><input type="number" min="1" name="value" value="${esc(x.value)}" ${PRICE_IN} aria-label="Value"></div></label>
        <label class="field"><span class="field__label">Minimum order <span class="field__opt">(optional)</span></span><div class="input--pre"><span>${esc(CUR.symbol)}</span><input type="number" min="0" name="minOrder" value="${x.minOrder || ''}" ${PRICE_IN} aria-label="Minimum order"></div></label></div>
      <label class="switch"><input type="checkbox" name="stackable" ${x.stackable ? 'checked' : ''}><span class="switch__track"></span><span class="switch__text">Allow stacking with deals and other discounts</span></label>
      <span class="field__hint" style="margin-top:-6px">Off by default, so only one discount or deal applies per order.</span>
      <label class="switch"><input type="checkbox" name="enabled" ${x.enabled ? 'checked' : ''}><span class="switch__track"></span><span class="switch__text">Active</span></label>
    </div><div class="mdl__foot"><button class="btn btn--line" type="button" data-act="modal-close">Cancel</button><button class="btn btn--brand">${x.id ? 'Save changes' : 'Create discount'}</button></div></form>`, { label: 'Discount' });
}
ACT['xf-new'] = () => xfOpen(null);
ACT['xf-edit'] = el => xfOpen(discBy(el.dataset.id));
CHG['xf-type'] = el => { $('#xf-unit').textContent = el.value === 'percent' ? '%' : CUR.symbol; };
FORM['xf'] = f => {
  const id = f.dataset.id; let bad = false;
  const name = f.name.value.trim(), code = f.code.value.trim().toUpperCase(), type = f.querySelector('[name=type]:checked').value, value = +f.value.value;
  fieldErr(f, 'name', name ? '' : 'Enter a name.'); if (!name) bad = true;
  let ce = ''; if (!/^[A-Z0-9]{3,20}$/.test(code)) ce = 'Use 3 to 20 letters or numbers, no spaces.'; else if (S.discounts.some(d => d.code === code && d.id !== id)) ce = 'Another discount already uses this code.';
  fieldErr(f, 'code', ce); if (ce) bad = true;
  const ve = !(value > 0) ? 'Enter a value above 0.' : (type === 'percent' && value > 100 ? 'A percentage can be at most 100.' : '');
  fieldErr(f, 'value', ve); if (ve) bad = true;
  if (bad) return;
  const data = { name, code, type, value, minOrder: roundMoney(f.minOrder.value || 0), stackable: f.stackable.checked, enabled: f.enabled.checked };
  if (id) Object.assign(discBy(id), data); else S.discounts.push({ id: 'x' + uid(), ...data });
  Modal.close(); commit(); toast(id ? 'Discount saved' : 'Discount created');
};

/* ---------- customers ---------- */
function allCustomers() {
  const map = new Map();
  S.customers.forEach(c => map.set(c.phone, { name: c.name, phone: c.phone, account: true, orders: [], since: c.createdAt }));
  S.orders.forEach(o => { const k = digits(o.phone); if (!map.has(k)) map.set(k, { name: o.name, phone: k, account: false, orders: [], since: o.at }); map.get(k).orders.push(o); });
  return [...map.values()].map(c => ({ ...c, spent: c.orders.reduce((s, o) => s + o.total, 0), last: c.orders.reduce((m, o) => Math.max(m, o.at), 0) })).sort((a, b) => b.last - a.last);
}
Admin.customers = () => {
  const list = allCustomers();
  return `<div class="toolbar"><div class="search">${icon('search')}<input class="input" type="search" placeholder="Search name or phone" data-filter="#ctbl tbody tr" aria-label="Search customers"></div><span class="small muted">${list.length} customers, ${list.filter(c => c.account).length} with accounts</span></div>
    <section class="adm-card"><div class="tbl-wrap"><table class="tbl tbl--cards" id="ctbl"><thead><tr><th>Customer</th><th>Phone</th><th>Type</th><th class="num">Orders</th><th class="num">Total spent</th><th>Last order</th></tr></thead><tbody>
    ${list.map(c => `<tr class="is-click" data-act="cust" data-phone="${c.phone}" tabindex="0" data-text="${esc((c.name + ' ' + c.phone + ' ' + fmtPhone(c.phone)).toLowerCase())}"><td><b>${esc(c.name)}</b></td><td data-l="Phone">${esc(fmtPhone(c.phone))}</td><td>${c.account ? '<span class="badge badge--done">Account</span>' : '<span class="badge badge--off">Guest</span>'}</td><td class="num" data-l="Orders">${c.orders.length}</td><td class="num" data-l="Total spent">${money(c.spent)}</td><td data-l="Last order">${c.last ? when(c.last) : 'No orders yet'}</td></tr>`).join('')}
    </tbody></table></div><p class="small faint" data-noresult hidden style="padding:20px">No customers match your search.</p></section>`;
};
ACT['cust'] = el => {
  const c = allCustomers().find(x => x.phone === el.dataset.phone); if (!c) return;
  const acct = S.customers.find(x => x.phone === c.phone);
  Modal.open(`${closeX()}<div class="mdl__head"><h2>${esc(c.name)}</h2><p>${esc(fmtPhone(c.phone))}, ${c.account ? 'has an account' : 'guest'}</p></div>
    <div class="mdl__body stack">
      <dl class="kv2" style="margin:0"><dt>Orders</dt><dd>${c.orders.length}</dd><dt>Total spent</dt><dd>${money(c.spent)}</dd>${acct ? `<dt>Saved address</dt><dd class="${acct.address ? '' : 'is-empty'}">${esc(acct.address || 'None')}</dd><dt>Customer since</dt><dd>${new Date(acct.createdAt).toLocaleDateString('en-GB', { dateStyle: 'medium' })}</dd>` : ''}</dl>
      <div class="adm-card"><div class="olist">${c.orders.length ? c.orders.sort((a, b) => b.at - a.at).map(o => `<a href="#/admin/orders/${o.no}"><span class="badge ${o.status === 'new' ? 'badge--new' : 'badge--done'}">${o.status === 'new' ? 'New' : 'Done'}</span><div><div class="olist__no">#${o.no}</div><div class="olist__who">${when(o.at)}</div></div><span class="olist__amt">${money(o.total)}</span></a>`).join('') : '<p class="muted" style="padding:16px">No orders yet.</p>'}</div></div>
    </div>`, { label: 'Customer' });
};

/* ---------- website ---------- */
Admin.website = () => {
  const s = S.settings;
  return `<section class="adm-card"><div class="adm-card__h"><div><h2>Logo</h2><p>Shown in the website header, footer, admin panel and order PDFs.</p></div></div><div class="adm-card__b stack">
      <div class="logoprev"><div class="logoprev__box logoprev__box--l">${logoImg('')}</div><div class="logoprev__box logoprev__box--d">${logoImg('', true)}</div></div>
      <div class="row row--wrap"><span class="btn btn--ink btn--sm filebtn">${icon('upload', 'ico--sm')}Upload new logo<input type="file" accept="image/*" data-chg="logo-up" aria-label="Upload new logo"></span>${s.logo ? '<button class="btn btn--ghost btn--sm" type="button" data-act="logo-reset">Remove uploaded logo</button>' : ''}<span class="field__hint">PNG with a transparent background works best. An uploaded logo is saved in this browser only. To change it for everyone, set it in config.js.</span></div></div></section>
    <form class="adm-card" data-form="w-info"><div class="adm-card__h"><div><h2>Restaurant information</h2><p>Shown on the homepage and footer.</p></div></div><div class="adm-card__b stack">
      <div class="grid2"><label class="field"><span class="field__label">Restaurant name</span><input class="input" name="name" value="${esc(s.name)}" required></label><label class="field"><span class="field__label">Phone</span><input class="input" name="phone" value="${esc(s.phone)}" inputmode="tel"></label></div>
      <div class="grid2"><label class="field"><span class="field__label">WhatsApp number 1</span><input class="input" name="wa1" value="${esc(s.whatsapp[0] || '')}" inputmode="tel"></label><label class="field"><span class="field__label">WhatsApp number 2 <span class="field__opt">(optional)</span></span><input class="input" name="wa2" value="${esc(s.whatsapp[1] || '')}" inputmode="tel"></label></div>
      <label class="field"><span class="field__label">Address</span><textarea class="textarea" name="address" style="min-height:64px">${esc(s.address)}</textarea></label>
      <label class="field"><span class="field__label">Delivery area <span class="field__opt">(optional)</span></span><input class="input" name="area" value="${esc(s.area || '')}" placeholder="For example: Springfield"><span class="field__hint">Shown on the homepage and at checkout.</span></label>
      <div><button class="btn btn--brand">Save information</button></div></div></form>
    <form class="adm-card" data-form="w-theme"><div class="adm-card__h"><div><h2>Brand color</h2><p>Used for buttons, prices and highlights. Saved in this browser only. To change it for everyone, set theme.brand in config.js.</p></div></div><div class="adm-card__b stack">
      <div class="row row--wrap" style="gap:14px"><input type="color" class="colorpick" name="color" value="${esc((themeVars(s.brandColor || TH.brand, '')['--b-brand']).toLowerCase())}" aria-label="Brand color">
        <div class="swatch-row" role="group" aria-label="Quick picks">${['#2F5BD3', '#C8102E', '#E8590C', '#1F7A4D', '#7B2D8E', '#1A1819'].map(c => `<button class="swatch" type="button" style="background:${c}" data-act="swatch" data-c="${c}" aria-label="Use ${c}"></button>`).join('')}</div></div>
      <div class="row row--wrap"><button class="btn btn--brand">Save color</button>${s.brandColor ? '<button class="btn btn--ghost" type="button" data-act="theme-reset">Use color from config.js</button>' : ''}</div></div></form>
    <form class="adm-card" data-form="w-hours"><div class="adm-card__h"><div><h2>Opening hours</h2><p>Shown to customers. Opening and closing for orders is controlled with the status switch.</p></div></div><div class="adm-card__b stack">
      <div class="grid2"><label class="field"><span class="field__label">Opens at</span><input class="input" type="time" name="opens" value="${esc(s.opensAt)}"></label><label class="field"><span class="field__label">Closes at</span><input class="input" type="time" name="closes" value="${esc(s.closesAt)}"></label></div>
      <label class="field"><span class="field__label">Days</span><input class="input" name="note" value="${esc(s.hoursNote)}" placeholder="Every day"></label>
      <p class="small muted">Customers see: ${esc(hoursText())}</p>
      <div><button class="btn btn--brand">Save hours</button></div></div></form>
    <section class="adm-card"><div class="adm-card__h"><div><h2>Ordering status</h2><p>The same switch is always at the top of the admin panel.</p></div></div><div class="adm-card__b stack">
      <div class="statusbig statusbig--${s.isOpen ? 'open' : 'closed'}"><span class="statusbig__ic">${icon(s.isOpen ? 'check' : 'clock', 'ico--lg')}</span><div><h2>${s.isOpen ? 'Open' : 'Closed'}</h2><p>${s.isOpen ? 'Customers can place orders.' : 'Ordering is paused.'}</p></div>${s.isOpen ? '<button class="btn btn--line" type="button" data-act="close-now">Close restaurant</button>' : '<button class="btn btn--brand" type="button" data-act="open-now">Open restaurant</button>'}</div>
      <form class="stack" data-form="w-closed"><label class="field"><span class="field__label">Message customers see while closed</span><textarea class="textarea" name="msg" style="min-height:64px">${esc(s.closedMsg)}</textarea></label><div><button class="btn btn--line">Save message</button></div></form>
    </div></section>`;
};
CHG['logo-up'] = async el => { try { S.settings.logo = await readFile(el, 600); commit(); toast('Logo updated everywhere'); } catch (e) { toast('Choose an image file (PNG or JPG).', { icon: 'alert' }); } };
ACT['logo-reset'] = () => { S.settings.logo = null; commit(); toast('Uploaded logo removed'); };
FORM['w-info'] = f => { const s = S.settings; if (!f.name.value.trim()) return fieldErr(f, 'name', 'Enter the restaurant name.'); s.name = f.name.value.trim(); s.phone = f.phone.value.trim(); s.whatsapp = [f.wa1.value.trim(), f.wa2.value.trim()]; s.address = f.address.value.trim(); s.area = f.area.value.trim(); commit(); toast('Restaurant information saved'); };
FORM['w-theme'] = f => { if (!hexRgb(f.color.value)) return; S.settings.brandColor = f.color.value.toUpperCase(); commit(); toast('Brand color saved'); };
ACT['swatch'] = el => { const i = $('.colorpick'); if (i) i.value = el.dataset.c.toLowerCase(); };
ACT['theme-reset'] = () => { S.settings.brandColor = null; commit(); toast('Using the color from config.js'); };
FORM['w-hours'] = f => { const s = S.settings; s.opensAt = f.opens.value; s.closesAt = f.closes.value; s.hoursNote = f.note.value.trim(); commit(); toast('Opening hours saved'); };
FORM['w-closed'] = f => { S.settings.closedMsg = f.msg.value.trim() || "We're currently closed. Please try again during our opening hours."; commit(); toast('Closed message saved'); };

/* ---------- settings ---------- */
Admin.settings = () => `<form class="adm-card" data-form="s-fee"><div class="adm-card__h"><div><h2>Delivery fee</h2><p>Added to every order. Customers see it in the cart and at checkout.</p></div></div><div class="adm-card__b stack">
      <label class="field" style="max-width:280px"><span class="field__label">Delivery fee</span><div class="input--pre"><span>${esc(CUR.symbol)}</span><input type="number" min="0" name="fee" value="${S.settings.deliveryFee}" ${PRICE_IN} aria-label="Delivery fee"></div><span class="field__hint">Set to 0 for free delivery.</span></label>
      <div><button class="btn btn--brand">Save delivery fee</button></div></div></form>
    <form class="adm-card" data-form="s-email" novalidate><div class="adm-card__h"><div><h2>Admin email</h2><p>Used to log in to this panel.</p></div></div><div class="adm-card__b stack">
      <div class="grid2"><label class="field"><span class="field__label">Email</span><input class="input" type="email" name="email" value="${esc(S.admin.email)}" autocomplete="username"></label>
      <label class="field"><span class="field__label">Current password</span><input class="input" type="password" name="pw" autocomplete="current-password"><span class="field__hint">Needed to confirm the change.</span></label></div>
      <div><button class="btn btn--brand">Save email</button></div></div></form>
    <form class="adm-card" data-form="s-pass" novalidate><div class="adm-card__h"><div><h2>Change password</h2></div></div><div class="adm-card__b stack">
      <label class="field" style="max-width:420px"><span class="field__label">Current password</span><input class="input" type="password" name="cur" autocomplete="current-password"></label>
      <div class="grid2"><label class="field"><span class="field__label">New password</span><input class="input" type="password" name="nw" autocomplete="new-password"><span class="field__hint">At least 8 characters.</span></label>
      <label class="field"><span class="field__label">Confirm new password</span><input class="input" type="password" name="cf" autocomplete="new-password"></label></div>
      <div><button class="btn btn--brand">Change password</button></div></div></form>
    <section class="adm-card"><div class="adm-card__h"><div><h2>Demo tools</h2><p>Only in demo mode.</p></div></div><div class="adm-card__b row row--wrap">
      <button class="btn btn--ink" type="button" data-act="simulate">${icon('zap', 'ico--sm')}Simulate a new order</button><button class="btn btn--line" type="button" data-act="reset-demo">${icon('refresh', 'ico--sm')}Reset demo data</button></div></section>`;
FORM['s-fee'] = f => { const v = f.fee.value === '' ? NaN : +f.fee.value; if (!(v >= 0)) return fieldErr(f, 'fee', 'Enter 0 or more.'); fieldErr(f, 'fee', ''); S.settings.deliveryFee = roundMoney(v); commit(); toast(`Delivery fee set to ${money(v)}`); };
FORM['s-email'] = f => {
  const em = f.email.value.trim(); let bad = false;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { fieldErr(f, 'email', 'Enter a valid email address.'); bad = true; } else fieldErr(f, 'email', '');
  if (sha256(f.pw.value) !== S.admin.hash) { fieldErr(f, 'pw', 'Current password is incorrect.'); bad = true; } else fieldErr(f, 'pw', '');
  if (bad) return; S.admin.email = em; commit(); toast('Admin email saved');
};
FORM['s-pass'] = f => {
  let bad = false;
  if (sha256(f.cur.value) !== S.admin.hash) { fieldErr(f, 'cur', 'Current password is incorrect.'); bad = true; } else fieldErr(f, 'cur', '');
  if (f.nw.value.length < 8) { fieldErr(f, 'nw', 'Use at least 8 characters.'); bad = true; } else fieldErr(f, 'nw', '');
  if (f.cf.value !== f.nw.value) { fieldErr(f, 'cf', "Passwords don't match."); bad = true; } else fieldErr(f, 'cf', '');
  if (bad) return; S.admin.hash = sha256(f.nw.value); commit(); toast('Password changed');
};

/* ---------- render ---------- */
Admin.render = r => {
  const sec = r.parts[1] || '';
  if (!S.session.admin) { document.title = 'Admin login, ' + S.settings.name; return Admin.login(); }
  if (sec === 'login') { setTimeout(() => go('#/admin'), 0); return ''; }
  const map = {
    '': ['Dashboard', Admin.dashboard], orders: ['Orders', Admin.orders], categories: ['Categories', Admin.categories], products: ['Products', Admin.products],
    deals: ['Deals', Admin.deals], discounts: ['Discounts', Admin.discounts], customers: ['Customers', Admin.customers], website: ['Website', Admin.website], settings: ['Settings', Admin.settings]
  };
  let [title, fn] = map[sec] || map[''];
  let body;
  if (sec === 'orders' && r.parts[2]) { title = 'Order #' + r.parts[2]; body = Admin.order(r); }
  else body = fn(r);
  const n = unreadOrders().length;
  document.title = (n ? `(${n}) ` : '') + title + ', ' + S.settings.name + ' admin';
  return admShell(r, title, body);
};
Admin.after = () => { checkNotify(); };

render();
if (CFG_CHANGED) setTimeout(() => toast('config.js or menu.js changed, so the demo data was refreshed.', { icon: 'refresh', ms: 5200 }), 300);

</script>
</body>
</html>
